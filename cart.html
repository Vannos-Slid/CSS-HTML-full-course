<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/Chicken.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
    <title>Cart</title>
</head>

<body>
    <nav>
        <a href="./add-to-cart-1.html" class="logo">Ecommerce.</a>

        <a href="./cart.html" class="cart-icon">
            <i class="ri-shopping-bag-line"></i>
            <span class="cart-item-count">1</span>
        </a>
    </nav>

    <div class="cart">
        <div class="cart-header">
            <span>Products</span>
            <span>Price</span>
            <span>Quantity</span>
            <span>Total</span>
            <span>Remove</span>
        </div>

        <div class="cart-items">
            <div class="cart-item">
                <div class="product">
                    <img src="./img/add-to-cart-1/product1_green_1.jpg" alt="">
                    <div class="item-detail">
                        <p>Men Casual Round Neck T-Shirt</p>
                        <div class="size-color-box">
                            <span class="size">L</span>
                            <span class="color">Green</span>
                        </div>
                    </div>
                </div>

                <span class="price">$100</span>
                <div class="quantity"><input type="number" value="1" min="1" name="" id=""></div>
                <span class="total-price">$100</span>
                <button class="remove"><i class="ri-close-line"></i></button>
            </div>
        </div>

        <div class="cart-total">
            <h3>Cart Total</h3>
            <p>Subtotal <span class="subtotal">$0</span></p>
            <p>Delivery Fee <span>Free</span></p>
            <p>Grand Total <span class="grand-total">$0</span></p>
            <button class="btn">Procced to Checkout</button>
        </div>
    </div>


    <script src="./js/add-to-cart-1.js"></script>
</body>

</html>

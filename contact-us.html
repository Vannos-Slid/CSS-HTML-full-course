<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/Chicken.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
    <title>Product Detail</title>
</head>

<body>
    <section class="contact">
        <h2>Contact Me</h2>

        <form action="#">
            <div class="input-box">
                <div class="input-field field">
                    <input type="text" name="" id="name" placeholder="Full Name" class="item" autocomplete="">
                    <div class="error-txt">Full Name can't be blank</div>
                </div>
                <div class="input-field field">
                    <input type="email" name="" id="email" placeholder="Email Address" class="item" autocomplete="">
                    <div class="error-txt email">Email Address can't be blank</div>
                </div>
            </div>

            <div class="input-box">
                <div class="input-field field">
                    <input type="text" name="" id="phone" placeholder="Phone Number" class="item" autocomplete="">
                    <div class="error-txt">Phone Number can't be blank</div>
                </div>
                <div class="input-field field">
                    <input type="text" name="" id="subject" placeholder="Subject" class="item" autocomplete="off">
                    <div class="error-txt">Subject can't be blank</div>
                </div>
            </div>

            <div class="tetrarea-field field">

                <textarea name="" id="message" cols="30" rows="10" placeholder="Your Message" class="item"
                    autocomplete="off"></textarea>
                <div class="error-txt">Message can't be blank</div>

            </div>

            <button type="submit">Send Message</button>
        </form>
    </section>

    <script src="https://smtpjs.com/v3/smtp.js"></script>
    <script src="./js/contact-us.js"></script>
</body>

</html>

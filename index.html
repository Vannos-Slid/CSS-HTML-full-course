<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="icon" type="image/png" href="img/Chicken.png" />
    <link rel="stylesheet" href="css/email-form.css" />
    <script src="https://kit.fontawesome.com/b4ca65fb9b.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="contact-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
            <div class="contact-left-title">
                <h2>Get in touch</h2>
                <hr>
            </div>

            <input type="hidden" name="access_key" value="c96ed4a4-14f9-4500-9493-72a04a0eb657">

            <input type="text" name="name" placeholder="Your Name" class="contact-inputs" required>
            <input type="email" name="email" placeholder="Your Email" class="contact-inputs" required>

            <textarea name="messege" placeholder="Your Messege" class="contact-inputs" required></textarea>
            <button type="submit">Submit <img src="./img/email-form/arrow_icon.png" alt=""></button>

        </form>

        <div class="contact-right">

            <img src="./img/email-form/right_img.png" alt="">
        </div>
    </div>

</body>

</html>
